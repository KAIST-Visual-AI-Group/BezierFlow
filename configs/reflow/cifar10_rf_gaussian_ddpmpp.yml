model:
  name: ncsnpp
  scale_by_sigma: false
  ema_rate: 0.999999
  dropout: 0.15
  normalization: GroupNorm
  nonlinearity: swish
  nf: 128
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 4
  attn_resolutions: [16,]
  resamp_with_conv: true
  conditional: true
  fir: false
  fir_kernel: [1, 3, 3, 1]
  skip_rescale: true
  resblock_type: biggan
  progressive: none
  progressive_input: none
  progressive_combine: sum
  attention_type: ddpm
  init_scale: 0.
  embedding_type: positional
  fourier_scale: 16
  conv_size: 3

  # not used
  sigma_max: 50
  sigma_min: 0.01
  num_scales: 1000
  beta_min: 0.1
  beta_max: 20.

data:
  dataset: cifar10
  image_size: 32
  num_channels: 3
  random_flip: true
  centered: true
  uniform_discretization: false